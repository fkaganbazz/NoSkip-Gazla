<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Diken ifadeleri</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF8F2;font-family:'Nunito',system-ui,sans-serif;color:#24163F}
a{color:#1F7A45}a:hover{color:#165C34}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; box-sizing: border-box; padding: 52px 56px; display: flex; flex-direction: column; gap: 28px; background: #FFF8F2; font-family: 'Nunito', system-ui, sans-serif; color: #24163F">
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 56px; line-height: 1">İfadeler</h1>
<p style="margin: 0; font-size: 18px; font-weight: 600; color: #3F3358">Her ifadenin hangi anda kullanılacağı altında yazıyor.</p>
</div>
<span style="padding: 8px 14px; border-radius: 999px; background: #24163F; color: #FFF8F2; font-size: 14px; font-weight: 800">9 ifade · tek bileşen</span>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{moods}}" as="m" hint-placeholder-count="10">
<div style="height: 380px; box-sizing: border-box; border-radius: 28px; background: #FFFFFF; border: 1px solid #EFE6DC; overflow: hidden; display: flex; flex-direction: column">
<div style="height: 250px; background: {{m.tint}}; display: flex; align-items: flex-end; justify-content: center">
<dc-import name="Diken" mood="{{m.mood}}" stage="tam" size="176" hint-size="176px,220px"></dc-import>
</div>
<div style="padding: 16px 18px; display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 25px; line-height: 1.05">{{m.name}}</div>
<div style="font-size: 15px; font-weight: 600; line-height: 1.4; color: #3F3358">{{m.use}}</div>
</div>
</div>
</sc-for>
<div style="height: 380px; box-sizing: border-box; padding: 24px; border-radius: 28px; background: #24163F; color: #FFF8F2; display: flex; flex-direction: column; gap: 12px">
<div style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.05">Az ama yerinde</div>
<div style="font-size: 16px; font-weight: 600; line-height: 1.5; color: #E4DBF2">Diken ana ekranda, tamamlama anında, seri koptuğunda ve bildirimlerde görünür. Her ekrana koyarsak etkisi kaybolur.</div>
<div style="margin-top: auto; font-size: 14px; font-weight: 700; line-height: 1.45; color: #B7AACF">Bileşen: Diken · ifade, aşama ve aksesuar ayarlanabilir</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const moods = [
{ mood: 'mutlu', name: 'Mutlu', use: 'Günlük görev tamamlanınca, ana ekranda', tint: '#DDF3E4' },
{ mood: 'selam', name: 'Selam', use: 'Karşılama ekranı ve ilk açılış', tint: '#E0EEFF' },
{ mood: 'laf', name: 'Laf sokma', use: 'Dürtme mesajları, bildirim izni', tint: '#FFE3D2' },
{ mood: 'cosku', name: 'Coşkulu', use: 'Tamamlama anı, seri kurtarılınca', tint: '#FFF1C7' },
{ mood: 'gurur', name: 'Gururlu', use: 'Challenge bitince, rozet kazanınca', tint: '#FFF1C7' },
{ mood: 'endise', name: 'Endişeli', use: 'Gün bitmek üzereyken, görev bekliyorken', tint: '#EDE7F6' },
{ mood: 'saskin', name: 'Şaşkın', use: 'Arkadaşın seni geçince, keşfet vitrini', tint: '#E0EEFF' },
{ mood: 'uykulu', name: 'Uykulu', use: 'Boş durum, gece sessiz saatler', tint: '#EDE7F6' },
{ mood: 'solgun', name: 'Solmuş', use: 'Seri koptuğunda, hesap silerken', tint: '#F1ECE2' }
];
return { moods };
}
}
</script>
</body>
</html>
