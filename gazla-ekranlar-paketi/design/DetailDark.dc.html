<div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px">

</sc-if>
<sc-if value="{{d.future}}" hint-placeholder-val="{{ true }}">
<div style="aspect-ratio: 1; border-radius: 9px; background: #2B1E47; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #B7AACF">{{d.n}}</div>
</sc-if>
</sc-for>
</div>
<div style="display: flex; gap: 14px; font-size: 12px; font-weight: 700; color: #E4DBF2">

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const days = [];
for (let n = 1; n <= 30; n++) {
days.push({ n, done: n < 12 && n !== 8, saved: n === 8, today: n === 12, future: n > 12 });
}
return { days };
}
}
</script>
