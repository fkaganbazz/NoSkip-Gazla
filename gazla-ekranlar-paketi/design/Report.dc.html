<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Şikayet et</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF8F2;font-family:'Nunito',system-ui,sans-serif;color:#24163F}
a{color:#1F7A45}a:hover{color:#165C34}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; padding: 56px 20px 30px; display: flex; flex-direction: column; background: #FFF8F2; font-family: 'Nunito', system-ui, sans-serif; color: #24163F">

<div style="display: flex; align-items: center; gap: 12px">
<a href="FriendProfile.dc.html" aria-label="Kapat" style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border-radius: 22px; background: #FFFFFF; border: 1px solid #EFE6DC; display: flex; align-items: center; justify-content: center; color: #24163F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18"></path></svg></a>
<div style="flex-grow: 1; text-align: center; font-size: 17px; font-weight: 800">Şikayet et</div>
<span style="width: 44px; flex-shrink: 0"></span>
</div>

<div style="margin-top: 20px; display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 27px; line-height: 1.1">Ece hakkında ne oldu?</h1>
<p style="margin: 0; font-size: 15px; font-weight: 600; line-height: 1.45; color: #3F3358">Şikayetin gizli kalır. Ece bunu kimin bildirdiğini görmez.</p>
</div>

<div role="radiogroup" aria-label="Şikayet nedeni" style="margin-top: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #EFE6DC; overflow: hidden">
<sc-for list="{{reasons}}" as="r" hint-placeholder-count="5">
<button type="button" role="radio" aria-checked="{{r.checked}}" onClick="{{r.pick}}" style="width: 100%; min-height: 54px; padding: 0 16px; border: none; border-bottom: 1px solid #F4EDE5; background: {{r.bg}}; display: flex; align-items: center; gap: 12px; font-family: inherit; font-size: 16px; font-weight: 800; color: #24163F; text-align: left; cursor: pointer">
<span style="width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 11px; border: {{r.ring}}; background: #FFFFFF"></span>
{{r.text}}
</button>
</sc-for>
</div>

<div style="margin-top: 14px; display: flex; flex-direction: column; gap: 6px">
<label for="detay" style="font-size: 14px; font-weight: 800">Ayrıntı ekle (isteğe bağlı)</label>
<textarea id="detay" placeholder="Ne olduğunu kısaca yaz" style="height: 84px; box-sizing: border-box; padding: 12px 14px; border-radius: 16px; border: 2px solid #E3D8CC; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; color: #24163F; resize: none"></textarea>
</div>

<label style="margin-top: 12px; min-height: 44px; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 800; cursor: pointer">
<input type="checkbox" checked="checked" style="width: 22px; height: 22px; margin: 0; accent-color: #1F7A45">
Ece'yi de engelle
</label>

<div style="margin-top: 4px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #3F3358">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B4A7A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5 V12 L15 14"></path></svg>
<span>Ekibimiz şikayetleri 24 saat içinde inceler.</span>
</div>

<a href="FriendProfile.dc.html" style="margin-top: auto; height: 56px; border-radius: 18px; background: #24163F; box-shadow: 0 4px 0 #0E0820; color: #FFF8F2; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 17px; font-weight: 800">Şikayeti gönder</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: 0 };
}
renderVals() {
const list = ['Hakaret veya zorbalık', 'Uygunsuz fotoğraf', 'Spam veya sahte hesap', 'Tehlikeli bir challenge', 'Başka bir şey'];
const reasons = list.map((text, i) => {
const on = this.state.picked === i;
return { text, checked: on ? 'true' : 'false', bg: on ? '#F3FBF6' : '#FFFFFF', ring: on ? '7px solid #1F7A45' : '2px solid #B9AFA4', pick: () => this.setState({ picked: i }) };
});
return { reasons };
}
}
</script>
</body>
</html>
