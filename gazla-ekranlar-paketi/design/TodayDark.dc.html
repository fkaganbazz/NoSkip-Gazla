<a href="Poke.dc.html" style="width: 62px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: #FFF8F2">

<div style="position: absolute; left: 0; bottom: 0">
<dc-import name="TabBar" active="bugun" dark="true" hint-size="390px,88px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { done: { phone: true, read: false, plank: false } };
}
renderVals() {
const done = this.state.done;
const base = [
{ id: 'phone', type: 'check', title: 'Uyanınca 1 saat telefonsuz', meta: 'Gün 12/30 · Grup 4 kişi', pct: 40, href: 'DetailDark.dc.html', tint: '#2E2352', ink: '#CDBEF5', icon: 'M8 3 H16 C17.1 3 18 3.9 18 5 V19 C18 20.1 17.1 21 16 21 H8 C6.9 21 6 20.1 6 19 V5 C6 3.9 6.9 3 8 3 Z M11 18 H13 M3.5 3.5 L20.5 20.5' },
{ id: 'read', type: 'photo', title: 'Her gün 20 sayfa oku', meta: 'Gün 4/30 · Fotoğraf kanıtı', pct: 13, href: 'PhotoProof.dc.html', tint: '#42203A', ink: '#FFB3CF', icon: 'M4 5.5 C6.5 4.5 9.5 4.5 12 6 C14.5 4.5 17.5 4.5 20 5.5 V19 C17.5 18 14.5 18 12 19.5 C9.5 18 6.5 18 4 19 Z M12 6 V19.5' },
{ id: 'plank', type: 'number', title: 'Plank: her gün +5 saniye', meta: 'Gün 3/10 · Bugün 70 sn', pct: 30, href: 'NumberEntry.dc.html', tint: '#16372A', ink: '#8BE0AE', icon: 'M20 13.5 A8 8 0 1 1 4 13.5 A8 8 0 1 1 20 13.5 Z M12 9.5 V13.5 L14.5 16 M9.5 2.5 H14.5' }
];
const tasks = base.map((c) => {
const d = !!done[c.id];
return {
...c,
done: d,
todoCheck: !d && c.type === 'check',
todoPhoto: !d && c.type === 'photo',
todoNumber: !d && c.type === 'number',
labelDone: c.title + ': tamamlandı, geri al',
labelTodo: c.title + ': bugünü tamamla',
toggle: () => this.setState({ done: { ...this.state.done, [c.id]: !this.state.done[c.id] } })
};
});
const count = tasks.filter((t) => t.done).length;
const titles = ['Diken susadı', 'Diken hâlâ susuz', 'Az kaldı, bırakma', 'Diken kana kana içti'];
const subs = ['3 görev kaldı. Günün bitmesine 1 sa 16 dk var.', '2 görev kaldı. Günün bitmesine 1 sa 16 dk var.', 'Tek görev kaldı. Diken bardağı görüyor.', 'Bugün tamam. Serin 13 gün oldu.'];
const moods = ['endise', 'endise', 'mutlu', 'cosku'];
const drops = [0, 1, 2].map((i) => ({ fill: i < count ? '#3BAE6A' : 'transparent' }));
return {
tasks,
doneCount: count,
heroTitle: titles[count],
heroSub: subs[count],
heroMood: moods[count],
streakLabel: count === 3 ? '13 GÜNLÜK SERİ' : '12 GÜNLÜK SERİ',
drops,
dropLabel: count + '/3 su'
};
}
}
</script>
